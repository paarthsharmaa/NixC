# tmux colors — generated by matugen; sourced by tmux.conf and re-sourced
# live by theme-apply.
set -g status-style "bg=default,fg={{colors.on_surface_variant.default.hex}}"
set -g status-left "#[fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}},bold] #S #[bg=default] "
set -g status-right "#[fg={{colors.primary.default.hex}}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg={{colors.outline.default.hex}}]#h "
set -g window-status-format "#[fg={{colors.outline.default.hex}}] #I:#W "
set -g window-status-current-format "#[fg={{colors.primary.default.hex}},bold] #I:#W "
set -g window-status-current-style default
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
# Prompts (rename, command line) and lists (choose-tree sessions) stay
# see-through like the rest of the terminal: colored text, no block.
set -g message-style "bg=default,fg={{colors.primary.default.hex}}"
set -g message-command-style "bg=default,fg={{colors.primary.default.hex}}"
set -g mode-style "bg=default,fg={{colors.primary.default.hex}},bold"
# choose-tree (prefix s) preview: tmux 3.8 paints its frame and the
# centered window label on a solid grey (bg=themedarkgrey) by default.
setw -g tree-mode-border-style "bg=default,fg={{colors.outline_variant.default.hex}}"
setw -g tree-mode-preview-style "fg={{colors.primary.default.hex}},bold"
# Copy-mode selection still needs a real highlight to see what's selected.
set -g copy-mode-selection-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"
setw -g clock-mode-colour "{{colors.primary.default.hex}}"
