# hyprlock — generated by iris
# Material You style, based on Hyprlock-Dots layouts 18/2/3

general {
    grace = 1
    no_fade_in = true
    hide_cursor = false
    ignore_empty_input = true
    text_trim = true
}

# wallpaper — iris-apply keeps this symlink on your current wallpaper
background {
    monitor =
    path = ~/.cache/iris/wallpaper
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

# ── split clock (layout 18) ──
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color = {accent}
    font_size = 60
    font_family = JetBrainsMono Nerd Font
    position = -60, 380
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +":%M")</span>"
    color = {fg}
    font_size = 60
    font_family = JetBrainsMono Nerd Font
    position = 45, 380
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = {dim}
    font_size = 19
    font_family = JetBrainsMono Nerd Font
    position = 0, 320
    halign = center
    valign = center
}

# ── greeting pill + input field stacked (layout 18) ──
shape {
    monitor =
    size = 200, 50
    color = rgba({surface.rgb}, 0.85)
    rounding = 15
    position = 0, -420
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 0
    outer_color = rgba({surface.rgb}, 0)
    inner_color = rgba({surface.rgb}, 0.85)
    font_color = {fg}
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = true
    placeholder_text = <i><span foreground="{fg}">  Enter passwd</span></i>
    hide_input = false
    position = 0, -420
    halign = center
    valign = center
    zindex = 20
}

# ── avatar (layout 18) ──
image {
    monitor =
    path = ~/.face
    size = 180
    rounding = -1
    border_size = 2
    border_color = {accent}
    position = 0, 130
    halign = center
    valign = center
}

# ── battery pill (layout 3) ──
shape {
    monitor =
    size = 70, 35
    color = rgba({surface.rgb}, 0.85)
    rounding = 10
    position = -30, -30
    halign = right
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:10000] cat /sys/class/power_supply/BAT?/capacity | head -1 | tr -d '\n' ; echo "%"
    color = {fg}
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -30, -30
    halign = right
    valign = bottom
    zindex = 5
}
